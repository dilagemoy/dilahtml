<script>
  // Data Default Produk (Ditambahkan fallback placeholder jika gambar lokal gagal muat)
  let products = [
    {
      id: 'prod-1',
      title: 'Samsung Galaxy Z Flip5',

      category: 'Smartphone',
      badge: 'HOT ITEM 🔥',

      video: './SAMSUNG.mp4'
    },
    {
      id: 'prod-2',

      price: 17299000,

      rating: '⭐⭐⭐⭐⭐ (5.0)',
      desc: 'Layar 14" 3K OLED 120Hz, bobot 1.2 kg, Intel Core Ultra, desain ultra-thin.',
      img: './foto 2 asus.jpg',
      fallbackImg: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500&auto=format&fit=crop&q=60',
      video: './ASUS.mp4'
    },
    {
      id: 'prod-3',

      price: 4999000,
      category: 'Tablet',

      desc: 'Layar 11" WQHD+ 144Hz, Snapdragon 870, Quad Speaker Dolby Atmos.',
      img: './foto 3 xiomi.jpg',
      fallbackImg: 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500&auto=format&fit=crop&q=60',
      video: './XIAOMI.mp4'
    },
    {
      id: 'prod-4',
      title: 'Huawei Watch FIT 3',
      price: 2299000,
      category: 'Aksesoris',
      badge: 'PROMO 🏷️',
      rating: '⭐⭐⭐⭐ (4.7)',
      desc: 'Layar AMOLED 1.82", Pemantau Kesehatan & GPS, Baterai 10 Hari.',
      img: './foto 4 huwaeei.jpg',
      fallbackImg: 'https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=500&auto=format&fit=crop&q=60',
      video: './HUAWEI.mp4'
    },
    {
      id: 'prod-5',
      title: 'Nothing Ear (a)',
      price: 1699000,
      category: 'Aksesoris',
      badge: 'POPULAR 🎵',
      rating: '⭐⭐⭐⭐⭐ (4.9)',
      desc: 'Smart Active Noise Cancellation (ANC) 45dB, desain transparan, baterai 42.5 jam.',
      img: './foto 5 nothing.jpg',
      fallbackImg: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500&auto=format&fit=crop&q=60',
      video: './NOTING.mp4'
    }
  ];

  let productCount = products.length;
  let cart = [];
  let orders = [];

  function escapeString(str) {
    if (!str) return '';
    return str
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;')
      .replace(/\n/g, ' ');
  }

  function showToast(msg) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<span>✨</span> <span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3200);
  }

  function toggleWishlist(btn) {
    btn.classList.toggle('active');
    if (btn.classList.contains('active')) {
      btn.innerHTML = '💖';
      showToast('Ditambahkan ke favoritmu! 💖');
    } else {
      btn.innerHTML = '🤍';
    }
  }

  function adjustCardQty(inputId, delta) {
    const input = document.getElementById(inputId);
    if (!input) return;
    let currentVal = parseInt(input.value) || 1;
    currentVal += delta;
    if (currentVal < 1) currentVal = 1;
    input.value = currentVal;
  }

  function handleBackdropClick(event, modalId) {
    if (event.target.id === modalId) {
      if (modalId === 'detailModal') closeDetailModal();
      else if (modalId === 'cartModal') toggleCartModal();
      else if (modalId === 'editModal') closeEditModal();
    }
  }

  // Render Produk dengan Penanganan Gambar Rusak/Tidak Ditemukan
  function renderProducts() {
    const grid = document.getElementById('productGrid');
    if (!grid) return;
    grid.innerHTML = '';

    products.forEach(p => {
      const qtyId = 'qty-' + p.id;
      const card = document.createElement('div');
      card.className = 'product-card';
      card.id = p.id;
      card.setAttribute('data-category', p.category);

      const safeTitle = escapeString(p.title);
      const safeDesc = escapeString(p.desc);
      const safeCategory = escapeString(p.category);
      const safeRating = escapeString(p.rating);
      const safeImg = escapeString(p.img);
      const safeVideo = escapeString(p.video);
      const safeFallback = escapeString(p.fallbackImg || 'https://via.placeholder.com/300x200?text=Gadget');

      card.innerHTML = `
        <span class="product-badge">${p.badge}</span>
        <button class="btn-wishlist" onclick="toggleWishlist(this)">🤍</button>
        <div class="card-clickable-area" onclick="openDetailModal('${safeTitle}', ${p.price}, '${safeCategory}', '${safeRating}', '${safeDesc}', '${safeImg}', '${safeVideo}', '${safeFallback}')">
          <img src="${p.img}" class="product-img" alt="${p.title}" onerror="this.onerror=null; this.src='${safeFallback}';">
          <div class="product-body">
            <div class="rating-box">${p.rating}</div>
            <h3 class="product-title">${p.title}</h3>
            <div class="product-price">Rp ${p.price.toLocaleString('id-ID')}</div>
            <p class="product-desc">${p.desc}</p>
            <div class="btn-preview-video">🎬 Putar Video Review & Spesifikasi</div>
          </div>
        </div>
        <div style="padding: 0 18px 18px 18px;">
          <div class="qty-container">
            <label>Jumlah:</label>
            <div class="qty-stepper">
              <button type="button" class="btn-qty-step" onclick="event.stopPropagation(); adjustCardQty('${qtyId}', -1)">-</button>
              <input type="number" id="${qtyId}" class="qty-input" value="1" min="1" readonly>
              <button type="button" class="btn-qty-step" onclick="event.stopPropagation(); adjustCardQty('${qtyId}', 1)">+</button>
            </div>
          </div>
          <button class="btn-buy" onclick="addToCart('${safeTitle}', ${p.price}, '${qtyId}', '${safeImg}', '${safeFallback}')">+ Keranjang 🛍️</button>
        </div>
      `;
      grid.appendChild(card);
    });
    filterProducts();
  }

  function renderInventoryTable() {
    const tbody = document.getElementById('inventoryTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    products.forEach(p => {
      const row = document.createElement('tr');
      row.id = 'row-' + p.id;
      const safeFallback = escapeString(p.fallbackImg || 'https://via.placeholder.com/50?text=Foto');
      row.innerHTML = `
        <td>
          <img src="${p.img}" class="admin-thumb" alt="${p.title}" onerror="this.onerror=null; this.src='${safeFallback}';">
        </td>
        <td>${p.title}</td>
        <td>Rp ${p.price.toLocaleString('id-ID')}</td>
        <td>
          <button class="btn-edit" onclick="openEditModal('${p.id}')">Edit</button>
          <button class="btn-delete" onclick="hapusProduk('${p.id}')">Hapus</button>
        </td>
      `;
      tbody.appendChild(row);
    });
    updateAdminStats();
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const role = document.getElementById('loginRole').value;

    document.getElementById('loginView').classList.add('hidden');

    if (role === 'Pembeli') {
      document.getElementById('pembeliUserDisplay').innerText = username;
      document.getElementById('pembeliView').classList.remove('hidden');
      document.getElementById('adminView').classList.add('hidden');
      showToast(`Selamat datang di Toko Cute, ${username}! 🎀`);
      renderProducts();
      renderBuyerOrders();
    } else {
      document.getElementById('adminUserDisplay').innerText = username;
      document.getElementById('adminView').classList.remove('hidden');
      document.getElementById('pembeliView').classList.add('hidden');
      showToast(`Selamat datang di Dashboard Admin, ${username}! 👑`);
      renderInventoryTable();
      renderAdminOrders();
    }
  });

  function logout() {
    closeDetailModal();
    document.getElementById('pembeliView').classList.add('hidden');
    document.getElementById('adminView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('loginForm').reset();
    cart = [];
    updateCartUI();
    showToast('Berhasil keluar sistem. Sampai jumpa! 💕');
  }

  function switchBuyerTab(tabName) {
    const btns = document.querySelectorAll('.tab-btn');
    btns.forEach(b => b.classList.remove('active'));

    document.getElementById('buyerTabKatalog').classList.add('hidden');
    document.getElementById('buyerTabPesanan').classList.add('hidden');

    if (tabName === 'katalog') {
      document.getElementById('buyerTabKatalog').classList.remove('hidden');
      btns[0].classList.add('active');
    } else if (tabName === 'pesanan') {
      document.getElementById('buyerTabPesanan').classList.remove('hidden');
      btns[1].classList.add('active');
      renderBuyerOrders();
    }
  }

  function filterProducts() {
    const searchValue = document.getElementById('searchInput').value.toLowerCase();
    const selectedCategory = document.getElementById('categoryFilter').value;
    const cards = document.querySelectorAll('.product-card');

    cards.forEach(card => {
      const title = card.querySelector('.product-title').innerText.toLowerCase();
      const category = card.getAttribute('data-category');

      const matchesSearch = title.includes(searchValue);
      const matchesCategory = (selectedCategory === 'all' || category === selectedCategory);

      if (matchesSearch && matchesCategory) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
  }

  function openDetailModal(title, price, category, rating, desc, imgUrl, videoUrl, fallbackUrl) {
    document.getElementById('modalProductTitle').innerText = title;
    document.getElementById('modalProductPrice').innerText = `Rp ${price.toLocaleString('id-ID')}`;
    document.getElementById('modalProductCategory').innerText = category;
    document.getElementById('modalProductRating').innerText = rating;
    document.getElementById('modalProductDesc').innerText = desc;

    const videoElement = document.getElementById('modalProductVideo');
    const formattedVideoUrl = (videoUrl.startsWith('./') || videoUrl.startsWith('http') || videoUrl.startsWith('https')) ? videoUrl : `./${videoUrl}`;

    videoElement.pause();
    videoElement.currentTime = 0;
    videoElement.src = formattedVideoUrl;
    videoElement.load();

    const playPromise = videoElement.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        videoElement.muted = true;
        videoElement.play().catch(e => console.log("Info autoplay video:", e));
      });
    }

    document.getElementById('modalQtyInput').value = 1;

    const buyBtn = document.getElementById('modalBuyBtn');
    buyBtn.onclick = function() {
      addToCartFromModal(title, price, imgUrl, fallbackUrl);
    };

    document.getElementById('detailModal').classList.remove('hidden');
  }

  function closeDetailModal() {
    const videoElement = document.getElementById('modalProductVideo');
    if (videoElement) {
      videoElement.pause();
      videoElement.currentTime = 0;
      videoElement.removeAttribute('src');
      videoElement.load();
    }
    document.getElementById('detailModal').classList.add('hidden');
  }

  function addToCartFromModal(title, price, img, fallbackImg) {
    const qtyInput = document.getElementById('modalQtyInput');
    const quantity = parseInt(qtyInput ? qtyInput.value : 1) || 1;

    if (quantity <= 0) {
      showToast('Jumlah pembelian minimal 1 ya!');
      return;
    }

    const existingItem = cart.find(item => item.title === title);
    if (existingItem) {
      existingItem.quantity += quantity;
    } else {
      cart.push({ title, price, quantity, img, fallbackImg });
    }

    updateCartUI();
    closeDetailModal();
    showToast(`🛍️ ${quantity}x ${title} dimasukkan ke keranjang!`);
  }

  function addToCart(title, price, qtyInputId, img, fallbackImg) {
    const qtyInput = document.getElementById(qtyInputId);
    const quantity = parseInt(qtyInput ? qtyInput.value : 1) || 1;

    if (quantity <= 0) {
      showToast('Jumlah pembelian minimal 1 ya!');
      return;
    }

    const existingItem = cart.find(item => item.title === title);
    if (existingItem) {
      existingItem.quantity += quantity;
    } else {
      cart.push({ title, price, quantity, img, fallbackImg });
    }

    if (qtyInput) qtyInput.value = 1;

    updateCartUI();
    showToast(`🛍️ ${quantity}x ${title} masuk keranjang!`);
  }

  function changeCartQty(index, delta) {
    if (!cart[index]) return;
    cart[index].quantity += delta;
    if (cart[index].quantity <= 0) {
      cart.splice(index, 1);
    }
    updateCartUI();
  }

  function removeCartItem(index) {
    if (!cart[index]) return;
    cart.splice(index, 1);
    updateCartUI();
  }

  function updateCartUI() {
    const container = document.getElementById('cartItemsContainer');
    const totalDisplay = document.getElementById('cartTotalDisplay');
    const paymentSec = document.getElementById('paymentSection');
    
    let totalItems = 0;
    let grandTotal = 0;

    cart.forEach(item => {
      totalItems += item.quantity;
      grandTotal += (item.price * item.quantity);
    });

    document.getElementById('cartCount').innerText = totalItems;

    if (cart.length === 0) {
      container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding:25px; font-weight: 600;">Keranjang kamu masih kosong nih, yuk isi dengan gadget impianmu! 🌸</p>`;
      totalDisplay.innerText = "Total: Rp 0";
      paymentSec.classList.add('hidden');
      return;
    }

    let html = '';
    cart.forEach((item, index) => {
      const itemTotal = item.price * item.quantity;
      const fallback = item.fallbackImg || 'https://via.placeholder.com/40';
      html += `
        <div class="cart-item">
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${item.img}" class="admin-thumb" style="width:40px; height:40px;" alt="${item.title}" onerror="this.onerror=null; this.src='${fallback}';">
            <div class="cart-item-info">
              <span><strong>${item.title}</strong></span>
              <span style="font-size:0.8rem; color: var(--text-muted);">Rp ${item.price.toLocaleString('id-ID')} / item</span>
            </div>
          </div>
          <div class="cart-item-actions">
            <button class="btn-qty-small" onclick="changeCartQty(${index}, -1)">-</button>
            <span><strong>${item.quantity}</strong></span>
            <button class="btn-qty-small" onclick="changeCartQty(${index}, 1)">+</button>
            <span style="min-width: 90px; text-align: right; color:#ff2a6d;">Rp ${itemTotal.toLocaleString('id-ID')}</span>
            <button class="btn-delete" style="padding: 3px 8px; margin-left: 6px;" onclick="removeCartItem(${index})">✕</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
    totalDisplay.innerText = `Total: Rp ${grandTotal.toLocaleString('id-ID')}`;
    paymentSec.classList.remove('hidden');
  }

  function toggleCartModal() {
    document.getElementById('cartModal').classList.toggle('hidden');
  }

  function checkoutCart() {
    if (cart.length === 0) return showToast('Keranjang kamu masih kosong!');
    
    const paymentMethod = document.getElementById('paymentMethod').value;
    const orderId = 'GST-' + Math.floor(100000 + Math.random() * 900000);
    const pembeliName = document.getElementById('pembeliUserDisplay').innerText;
    
    let grandTotal = 0;
    let itemsListHtml = '';
    let orderedItems = [];

    cart.forEach(item => {
      const itemTotal = item.price * item.quantity;
      grandTotal += itemTotal;
      itemsListHtml += `
        <div style="display:flex; justify-content:space-between; margin-bottom: 4px;">
          <span>${item.quantity}x ${item.title}</span>
          <span>Rp ${itemTotal.toLocaleString('id-ID')}</span>
        </div>
      `;
      orderedItems.push({ ...item });
    });

    orders.unshift({
      id: orderId,
      customer: pembeliName,
      items: orderedItems,
      total: grandTotal,
      paymentMethod: paymentMethod,
      status: 'Dibayar',
      date: new Date().toLocaleDateString('id-ID', { hour: '2-digit', minute: '2-digit' })
    });

    const receiptHtml = `
      <p style="margin-bottom: 6px;"><strong>No. Transaksi:</strong> <span style="color:#ff2a6d;">${orderId}</span></p>
      <p style="margin-bottom: 6px;"><strong>Pembeli:</strong> ${pembeliName}</p>
      <p style="margin-bottom: 6px;"><strong>Metode Pembayaran:</strong> ${paymentMethod}</p>
      <p style="margin-bottom: 6px;"><strong>Status Awal:</strong> <span style="color:#ffb703; font-weight:bold;">Dibayar ✅</span></p>
      
      <hr style="border: 0; border-top: 2px dashed #ffd1dc; margin: 12px 0;">
      
      <p style="margin-bottom: 6px; font-weight:700;">Rincian Pesanan:</p>
      ${itemsListHtml}
      
      <hr style="border: 0; border-top: 2px dashed #ffd1dc; margin: 12px 0;">
      
      <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.1rem; color:#ff2a6d;">
        <span>Total Bayar:</span>
        <span>Rp ${grandTotal.toLocaleString('id-ID')}</span>
      </div>
    `;

    document.getElementById('receiptDetails').innerHTML = receiptHtml;

    cart = [];
    updateCartUI();
    toggleCartModal();
    document.getElementById('successModal').classList.remove('hidden');
    showToast('🎉 Pembayaran berhasil dikonfirmasi!');
    
    renderAdminOrders();
    renderBuyerOrders();
  }

  function closeSuccessModal() {
    document.getElementById('successModal').classList.add('hidden');
  }

  function getStatusClass(status) {
    switch(status) {
      case 'Dibayar': return 'status-dibayar';
      case 'Dikemas': return 'status-dikemas';
      case 'Dikirim': return 'status-dikirim';
      case 'Selesai': return 'status-selesai';
      default: return 'status-dibayar';
    }
  }

  function getStatusIcon(status) {
    switch(status) {
      case 'Dibayar': return '💳';
      case 'Dikemas': return '📦';
      case 'Dikirim': return '🚚';
      case 'Selesai': return '✅';
      default: return '📍';
    }
  }

  function renderBuyerOrders() {
    const container = document.getElementById('buyerOrdersList');
    if (!container) return;

    const currentBuyer = document.getElementById('pembeliUserDisplay').innerText;
    const myOrders = orders.filter(o => o.customer === currentBuyer);

    if (myOrders.length === 0) {
      container.innerHTML = `
        <div style="text-align:center; padding: 40px; background:#ffffff; border-radius: 25px; border:3px dashed #ffd1dc;">
          <p style="font-size:1.1rem; color:var(--text-muted); font-weight:600;">Kamu belum memiliki transaksi pesanan nih! 🛍️</p>
        </div>
      `;
      return;
    }

    let html = '';
    myOrders.forEach(o => {
      let itemsSummary = o.items.map(i => {
        const fallback = i.fallbackImg || 'https://via.placeholder.com/30';
        return `
          <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
            <img src="${i.img}" class="admin-thumb" style="width:30px; height:30px;" onerror="this.onerror=null; this.src='${fallback}';">
            <span>${i.quantity}x ${i.title}</span>
          </div>
        `;
      }).join('');

      html += `
        <div class="order-card">
          <div class="order-header">
            <div>
              <strong style="color:#d62860; font-size: 1.1rem;">#${o.id}</strong>
              <span style="font-size:0.82rem; color:var(--text-muted); margin-left: 8px;">(${o.date})</span>
            </div>
            <span class="status-badge ${getStatusClass(o.status)}">
              ${getStatusIcon(o.status)} Status: ${o.status}
            </span>
          </div>
          <div style="font-size: 0.92rem; margin-bottom: 8px;">
            <strong>Produk:</strong> ${itemsSummary}
          </div>
          <div style="font-size: 0.92rem; margin-bottom: 8px;">
            <strong>Pembayaran:</strong> ${o.paymentMethod}
          </div>
          <div style="font-size: 1.1rem; font-weight:700; color:#ff2a6d;">
            Total: Rp ${o.total.toLocaleString('id-ID')}
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function renderAdminOrders() {
    const tbody = document.getElementById('adminOrdersTableBody');
    const statPesanan = document.getElementById('statTotalPesanan');
    if (!tbody) return;

    if (statPesanan) statPesanan.innerText = `${orders.length} Pesanan`;

    if (orders.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">Belum ada pesanan masuk dari pembeli.</td>
        </tr>
      `;
      return;
    }

    let html = '';
    orders.forEach(o => {
      let itemsHtml = o.items.map(i => {
        const fallback = i.fallbackImg || 'https://via.placeholder.com/35';
        return `
          <div class="admin-order-item">
            <img src="${i.img}" class="admin-thumb" style="width:35px; height:35px;" alt="${i.title}" onerror="this.onerror=null; this.src='${fallback}';">
            <span>${i.quantity}x ${i.title}</span>
          </div>
        `;
      }).join('');

      html += `
        <tr>
          <td><strong>#${o.id}</strong></td>
          <td>${o.customer}</td>
          <td>
            <div class="admin-order-item-list">${itemsHtml}</div>
          </td>
          <td style="color:#ff2a6d; font-weight:700;">Rp ${o.total.toLocaleString('id-ID')}</td>
          <td>
            <select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)">
              <option value="Dibayar" ${o.status === 'Dibayar' ? 'selected' : ''}>💳 Dibayar</option>
              <option value="Dikemas" ${o.status === 'Dikemas' ? 'selected' : ''}>📦 Dikemas</option>
              <option value="Dikirim" ${o.status === 'Dikirim' ? 'selected' : ''}>🚚 Dikirim</option>
              <option value="Selesai" ${o.status === 'Selesai' ? 'selected' : ''}>✅ Selesai</option>
            </select>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  function updateOrderStatus(orderId, newStatus) {
    const targetOrder = orders.find(o => o.id === orderId);
    if (targetOrder) {
      targetOrder.status = newStatus;
      showToast(`Status #${orderId} diubah ke: ${newStatus}`);
      renderBuyerOrders();
    }
  }

  document.getElementById('adminForm').addEventListener('submit', function(e) {
    e.preventDefault();

    productCount++;
    const newProd = {
      id: 'prod-' + productCount,
      title: document.getElementById('namaProduk').value.trim(),
      category: document.getElementById('kategoriProduk').value,
      price: parseInt(document.getElementById('hargaNominal').value) || 0,
      badge: 'NEW ✨',
      rating: '⭐⭐⭐⭐⭐ (5.0)',
      desc: document.getElementById('deskripsiText').value.trim(),
      img: document.getElementById('urlGambar').value.trim(),
      fallbackImg: 'https://via.placeholder.com/500x350?text=Produk+Baru',
      video: document.getElementById('urlVideo').value.trim()
    };

    products.push(newProd);
    renderInventoryTable();
    renderProducts();

    document.getElementById('adminForm').reset();
    showToast('✨ Produk baru berhasil diterbitkan!');
  });

  function openEditModal(prodId) {
    const p = products.find(item => item.id === prodId);
    if (!p) return;

    document.getElementById('editProdId').value = p.id;
    document.getElementById('editNama').value = p.title;
    document.getElementById('editKategori').value = p.category;
    document.getElementById('editHarga').value = p.price;
    document.getElementById('editDesc').value = p.desc;
    document.getElementById('editGambar').value = p.img;
    document.getElementById('editVideo').value = p.video;

    document.getElementById('editModal').classList.remove('hidden');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
  }

  document.getElementById('editForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('editProdId').value;
    const index = products.findIndex(p => p.id === id);

    if (index !== -1) {
      products[index].title = document.getElementById('editNama').value.trim();
      products[index].category = document.getElementById('editKategori').value;
      products[index].price = parseInt(document.getElementById('editHarga').value) || 0;
      products[index].desc = document.getElementById('editDesc').value.trim();
      products[index].img = document.getElementById('editGambar').value.trim();
      products[index].video = document.getElementById('editVideo').value.trim();

      renderInventoryTable();
      renderProducts();
      closeEditModal();
      showToast('✨ Perubahan produk berhasil disimpan!');
    }
  });

  function hapusProduk(prodId) {
    if (confirm('Hapus produk ini dari database?')) {
      products = products.filter(p => p.id !== prodId);
      renderInventoryTable();
      renderProducts();
      showToast('Produk dihapus.');
    }
  }

  function updateAdminStats() {
    const statElem = document.getElementById('statTotalProduk');
    if (statElem) {
      statElem.innerText = products.length + " Produk";
    }
  }

  renderProducts();
</script>

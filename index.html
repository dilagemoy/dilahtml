<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkyStore 🌸</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fff1f2; }
    </style>
</head>
<body class="text-gray-700 pb-24">

    <!-- Header / Navbar -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 shadow-sm px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl bg-pink-100 p-2 rounded-full">🐾</span>
            <h1 class="text-xl font-bold text-pink-500 tracking-wide">PinkyStore ✨</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleAdminPanel()" class="bg-pink-100 text-pink-600 px-3 py-1.5 rounded-full text-sm font-semibold hover:bg-pink-200 transition">⚙️ Admin Panel</button>
            <button onclick="toggleCart()" class="relative bg-pink-500 text-white p-2 rounded-full shadow-md hover:bg-pink-600 transition">
                🛒
                <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Banner / Kategori -->
    <main class="max-w-4xl mx-auto p-4">
        <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
            <button onclick="filterCategory('Semua')" class="category-btn bg-pink-500 text-white px-4 py-1.5 rounded-full text-sm font-semibold shadow-sm whitespace-nowrap">Semua</button>
            <button onclick="filterCategory('Boneka')" class="category-btn bg-white text-pink-500 border border-pink-200 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">Boneka 🧸</button>
            <button onclick="filterCategory('Piyama')" class="category-btn bg-white text-pink-500 border border-pink-200 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">Piyama 👚</button>
            <button onclick="filterCategory('Alat Tulis')" class="category-btn bg-white text-pink-500 border border-pink-200 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">Alat Tulis ✏️</button>
        </div>

        <!-- Daftar Produk -->
        <div id="product-grid" class="grid grid-cols-2 gap-4">
            <!-- Produk akan dimuat otomatis di sini -->
        </div>
    </main>

    <!-- Admin Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-pink-600">✨ Tambah Produk Baru</h3>
                <button onclick="toggleAdminPanel()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <form id="add-product-form" onsubmit="addProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Produk</label>
                    <input type="text" id="p-name" required class="w-full border border-pink-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Harga (Angka Saja, Cth: 50000)</label>
                    <input type="number" id="p-price" required class="w-full border border-pink-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori</label>
                    <select id="p-category" class="w-full border border-pink-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-400">
                        <option value="Boneka">Boneka</option>
                        <option value="Piyama">Piyama</option>
                        <option value="Alat Tulis">Alat Tulis</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Link Foto (URL https://...)</label>
                    <input type="url" id="p-image" required placeholder="https://..." class="w-full border border-pink-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <button type="submit" class="w-full bg-pink-500 text-white py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-pink-600 transition">Simpan & Tampilkan ✨</button>
            </form>

            <div class="mt-6 border-t pt-4">
                <h4 class="text-sm font-bold text-gray-600 mb-2">Daftar Produk & Hapus</h4>
                <div id="admin-product-list" class="space-y-2 max-h-40 overflow-y-auto">
                    <!-- List hapus produk -->
                </div>
            </div>
        </div>
    </div>

    <!-- Keranjang & Checkout Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-xl max-h-[90vh] overflow-y-auto flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-pink-600">🛍️ Keranjang Belanjaan</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items" class="space-y-3 flex-1 overflow-y-auto max-h-48 mb-4">
                <!-- Barang di keranjang -->
            </div>

            <div class="border-t pt-3 mb-4">
                <div class="flex justify-between font-bold text-gray-700 mb-3">
                    <span>Total:</span>
                    <span id="cart-total" class="text-pink-500">Rp 0</span>
                </div>

                <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Metode Pembayaran 💳</label>
                <select id="payment-method" class="w-full border border-pink-200 rounded-xl px-3 py-2 text-sm mb-4 focus:outline-none focus:border-pink-400 font-medium">
                    <option value="QRIS">QRIS (Scan & Bayar)</option>
                    <option value="Dana">DANA / OVO / GoPay</option>
                    <option value="Transfer Bank">Transfer Bank (BCA/Mandiri)</option>
                    <option value="COD">COD (Bayar di Tempat)</option>
                </select>

                <button onclick="checkout()" class="w-full bg-pink-500 text-white py-3 rounded-2xl font-bold shadow-md hover:bg-pink-600 transition">Bayar Sekarang 💸</button>
            </div>
        </div>
    </div>

    <!-- Modal Pembayaran Berhasil -->
    <div id="success-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl text-center space-y-4">
            <div class="text-6xl animate-bounce">🎉</div>
            <h3 class="text-xl font-bold text-pink-600">Pembayaran Berhasil!</h3>
            <p class="text-sm text-gray-600">Yeay! Pesanan kamu sudah berhasil dibayar dan akan segera diproses oleh admin PinkyStore. 💖</p>
            <button onclick="closeSuccessModal()" class="w-full bg-pink-500 text-white py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-pink-600 transition">Tutup & Belanja Lagi</button>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
        let products = JSON.parse(localStorage.getItem('pinky_products')) || [
            { id: 1, name: "Boneka Beruang Cokelat", price: 75000, category: "Boneka", image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop" },
            { id: 2, name: "Piyama Set Strawberry", price: 115000, category: "Piyama", image: "https://images.unsplash.com/photo-1584273143981-41c073dfe8f8?q=80&w=400&auto=format&fit=crop" },
            { id: 3, name: "Buku Catatan Pastel", price: 29000, category: "Alat Tulis", image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=400&auto=format&fit=crop" }
        ];

        let cart = [];
        let currentFilter = 'Semua';

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = currentFilter === 'Semua' ? products : products.filter(p => p.category === currentFilter);
            
            if(filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-gray-400 py-8 text-sm">Belum ada produk di kategori ini ✨</p>`;
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white p-3 rounded-3xl shadow-sm border border-pink-100 flex flex-col justify-between">
                        <div>
                            <div class="w-full h-36 rounded-2xl overflow-hidden mb-2 bg-pink-50">
                                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                            </div>
                            <h4 class="font-bold text-sm text-gray-800 line-clamp-1">${p.name}</h4>
                            <p class="text-xs text-pink-500 font-bold mt-1">Rp ${p.price.toLocaleString('id-ID')}</p>
                        </div>
                        <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-pink-100 text-pink-600 py-1.5 rounded-xl font-bold text-xs hover:bg-pink-500 hover:text-white transition flex items-center justify-center gap-1">
                            <span>+</span> Tambah
                        </button>
                    </div>
                `;
            });
            renderAdminList();
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.textContent.includes(cat)) {
                    btn.className = "category-btn bg-pink-500 text-white px-4 py-1.5 rounded-full text-sm font-semibold shadow-sm whitespace-nowrap";
                } else {
                    btn.className = "category-btn bg-white text-pink-500 border border-pink-200 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap";
                }
            });
            renderProducts();
        }

        function toggleAdminPanel() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
            renderCart();
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = Number(document.getElementById('p-price').value);
            const category = document.getElementById('p-category').value;
            const image = document.getElementById('p-image').value;

            const newProduct = { id: Date.now(), name, price, category, image };
            products.push(newProduct);
            localStorage.setItem('pinky_products', JSON.stringify(products));

            document.getElementById('add-product-form').reset();
            toggleAdminPanel();
            renderProducts();
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('pinky_products', JSON.stringify(products));
            renderProducts();
        }

        function renderAdminList() {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-pink-50/50 p-2 rounded-xl text-xs">
                        <span class="font-medium truncate max-w-[150px]">${p.name}</span>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-100 text-red-500 px-2.5 py-1 rounded-lg font-bold hover:bg-red-500 hover:text-white transition">Hapus 🗑️</button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').textContent = count;
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 text-sm py-4">Keranjang masih kosong 🛒</p>`;
                document.getElementById('cart-total').textContent = 'Rp 0';
                return;
            }

            cart.forEach(item => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-pink-50/40 p-2.5 rounded-2xl">
                        <div>
                            <h5 class="font-bold text-xs text-gray-800">${item.name}</h5>
                            <p class="text-xs text-pink-500 font-semibold">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-600 text-xs font-bold px-2 py-1">Hapus</button>
                    </div>
                `;
            });

            document.getElementById('cart-total').textContent = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartCount();
            renderCart();
        }

        function checkout() {
            if(cart.length === 0) {
                alert("Keranjang kamu masih kosong, yuk pilih barang dulu! 💖");
                return;
            }
            const paymentMethod = document.getElementById('payment-method').value;
            
            // Tutup keranjang & buka modal sukses pembayaran
            toggleCart();
            document.getElementById('success-modal').classList.remove('hidden');
            
            // Kosongkan keranjang setelah berhasil bayar
            cart = [];
            updateCartCount();
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.add('hidden');
        }

        renderProducts();
    </script>
</body>
</html>

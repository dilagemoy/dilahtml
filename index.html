<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkyStore - Toko Gemes Aesthetic 🌸</title>
    <!-- Google Fonts: Pacifico & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, #fff0f5 0%, #ffb6c1 50%, #ff69b4 100%); }
        .font-coquette { font-family: 'Pacifico', cursive; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="text-gray-700 pb-24 min-h-screen">

    <!-- ================= HALAMAN LOGIN ================= -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
        <div class="absolute -top-16 -left-16 w-60 h-60 bg-pink-400/50 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-16 -right-16 w-72 h-72 bg-rose-500/40 rounded-full blur-3xl"></div>

        <div class="bg-white/95 backdrop-blur-md rounded-[45px] p-8 w-full max-w-sm shadow-2xl border-4 border-pink-400 text-center space-y-6 relative z-10">
            
            <!-- LOGO TAS BELANJA (SHOPPING BAG) -->
            <div class="relative -mt-16 mb-2 flex justify-center">
                <div class="w-24 h-24 bg-gradient-to-tr from-pink-600 via-pink-400 to-rose-300 rounded-full flex items-center justify-center border-4 border-white shadow-xl animate-float">
                    <i class="fa-solid fa-bag-shopping text-white text-4xl"></i>
                </div>
            </div>

            <div class="-mt-3">
                <span class="bg-pink-100 text-pink-600 text-[10px] font-extrabold px-3.5 py-1 rounded-full uppercase tracking-widest border border-pink-300 shadow-sm">🎀 Welcome Cutie 🎀</span>
                <h1 class="font-coquette text-4xl text-transparent bg-clip-text bg-gradient-to-r from-pink-700 via-pink-500 to-rose-600 mt-2 tracking-wide drop-shadow-sm">PinkyStore ✨</h1>
                <p class="text-xs text-pink-600 font-bold mt-1">Silakan masuk untuk mulai belanja barang gemes!</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-left text-xs">
                <div>
                    <label class="block font-bold mb-1.5 text-pink-600 pl-1"><i class="fa-regular fa-user mr-1"></i> Nama Kamu</label>
                    <input type="text" id="login-name" required placeholder="Contoh: Nadila" class="w-full bg-pink-50/90 border-2 border-pink-300 rounded-2xl p-3.5 focus:outline-none focus:border-pink-600 transition font-medium text-gray-700 placeholder:text-pink-300 shadow-inner">
                </div>
                <div>
                    <label class="block font-bold mb-1.5 text-pink-600 pl-1"><i class="fa-solid fa-lock mr-1"></i> Password / Sandi</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-pink-50/90 border-2 border-pink-300 rounded-2xl p-3.5 focus:outline-none focus:border-pink-600 transition font-medium text-gray-700 placeholder:text-pink-300 shadow-inner">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-pink-600 via-pink-500 to-rose-500 hover:opacity-95 text-white font-extrabold py-3.5 rounded-2xl text-sm shadow-lg shadow-pink-400/60 transition transform active:scale-95 cursor-pointer">
                    Masuk ke Toko 🎀✨
                </button>
            </form>

            <div class="pt-4 border-t border-pink-200">
                <p class="text-[11px] text-pink-600 font-bold mb-2">Mau masuk sebagai pengelola toko?</p>
                <button onclick="openAdminLogin()" class="bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold px-4 py-2.5 rounded-2xl text-xs transition border border-pink-300 cursor-pointer w-full flex items-center justify-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Masuk Sebagai Admin 🛠️
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT TETAP SAMA SEPERTI SEBELUMNYA -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[35px] p-6 w-full max-w-sm shadow-xl text-center space-y-4 border-4 border-pink-400 relative">
            <div class="flex justify-center -mt-12 mb-1">
                <div class="w-20 h-20 bg-pink-100 rounded-full flex items-center justify-center border-4 border-white shadow-lg animate-float">
                    <i class="fa-solid fa-bag-shopping text-pink-500 text-3xl"></i>
                </div>
            </div>
            <div>
                <span class="bg-pink-100 text-pink-600 text-[9px] font-extrabold px-3 py-0.5 rounded-full uppercase tracking-widest border border-pink-300">Restricted Area 🛠️</span>
                <h3 class="text-lg font-bold text-pink-600 mt-1">Login Admin Toko</h3>
            </div>
            <input type="password" id="admin-pass" placeholder="Password (admin123)" class="w-full border-2 border-pink-300 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 font-medium text-center bg-pink-50/50">
            <div class="flex gap-2 pt-1">
                <button onclick="verifyAdmin()" class="flex-1 bg-gradient-to-r from-pink-600 to-rose-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md hover:opacity-90 transition">Masuk</button>
                <button onclick="closeAdminLogin()" class="flex-1 bg-gray-100 text-gray-600 py-2.5 rounded-xl font-bold text-xs hover:bg-gray-200 transition">Batal</button>
            </div>
        </div>
    </div>

    <!-- Sisa kode (Main App) tetap sama, silakan lanjutkan dari kode sebelumnya -->
    <script>
        // (Fungsi script tetap sama seperti sebelumnya, tidak perlu diubah)
        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value;
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-badge').textContent = `👋 Halo, ${name}`;
        }
        function openAdminLogin() { document.getElementById('admin-login-modal').classList.remove('hidden'); }
        function closeAdminLogin() { document.getElementById('admin-login-modal').classList.add('hidden'); }
        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === 'admin123') {
                location.reload(); // Sederhanakan untuk contoh
                alert("Login Admin Berhasil!");
            } else { alert("Password salah!"); }
        }
    </script>
</body>
</html>

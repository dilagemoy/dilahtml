<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BonekaKu Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#FFF5F8;
}

header{
    background:#FFC7D9;
    padding:15px 20px;
    color:#fff;
}

header h2{
    text-align:center;
}

.search{
    margin-top:10px;
    text-align:center;
}

.search input{
    width:90%;
    padding:10px;
    border:none;
    border-radius:20px;
}

.banner{
    background:#FFE2EC;
    margin:15px;
    padding:20px;
    text-align:center;
    border-radius:15px;
    color:#E75480;
}

.banner h3{
    margin-bottom:5px;
}

.produk{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.isi{
    padding:10px;
}

.nama{
    font-size:16px;
    font-weight:bold;
    margin-bottom:5px;
}

.harga{
    color:#ff4f8b;
    font-weight:bold;
    margin-bottom:8px;
}

button{
    width:100%;
    padding:8px;
    background:#FF9FC2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#FF6FA5;
}

footer{
    background:#FFC7D9;
    color:white;
    text-align:center;
    padding:12px;
    margin-top:20px;
}
</style>

</head>
<body>

<header>
    <h2>🧸 BonekaKu Store 🎀</h2>

    <div class="search">
        <input type="text" placeholder="Cari boneka favoritmu...">
    </div>
</header>

<div class="banner">
    <h3>💖 Promo Spesial Hari Ini 💖</h3>
    <p>Diskon hingga 50% untuk semua boneka lucu!</p>
</div>

<div class="produk">

<div class="card">
<img src="https://placehold.co/300x300/f8c8dc/ffffff?text=Teddy+Bear">
<div class="isi">
<p class="nama">🧸 Teddy Bear</p>
<p class="harga">Rp150.000</p>
<button>+ Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://placehold.co/300x300/ffd6e7/ffffff?text=Bunny+Pink">
<div class="isi">
<p class="nama">🐰 Bunny Pink</p>
<p class="harga">Rp120.000</p>
<button>+ Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://placehold.co/300x300/fadadd/ffffff?text=Cat+Plush">
<div class="isi">
<p class="nama">🐱 Cat Plush</p>
<p class="harga">Rp95.000</p>
<button>+ Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://placehold.co/300x300/ffe4ec/ffffff?text=Unicorn">
<div class="isi">
<p class="nama">🦄 Unicorn Doll</p>
<p class="harga">Rp180.000</p>
<button>+ Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://placehold.co/300x300/f8bfd1/ffffff?text=Brown+Bear">
<div class="isi">
<p class="nama">🤎 Brown Bear</p>
<p class="harga">Rp165.000</p>
<button>+ Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://placehold.co/300x300/f9d5e5/ffffff?text=Panda+Plush">
<div class="isi">
<p class="nama">🐼 Panda Plush</p>
<p class="harga">Rp175.000</p>
<button>+ Keranjang</button>
</div>
</div>

</div>

<footer>
💕 BonekaKu Store © 2026
</footer>

</body>
</html>
